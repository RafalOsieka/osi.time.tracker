name: Code Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: JetBrains/junie-github-action@v1
        with:
          junie_api_key: ${{ secrets.JUNIE_API_KEY }}
          use_single_comment: false
          prompt: |
            You are an expert senior software engineer acting as a meticulous code reviewer. 
            Review the provided code diff for this Pull Request.

            Focus strictly on:
            1. Strict compliance with OpenSpec specifications.
            2. Critical bugs, logical errors, and incorrect data flow.
            3. Security vulnerabilities (e.g., injection risks, unvalidated inputs, auth bypasses).
            4. Performance bottlenecks, memory leaks, or unhandled resource limits.
            5. Missing edge-case handling and inadequate error management.

            Never:
            - comment on: Code style, formatting, minor naming choices, or missing comments, unless they directly obscure functionality.
            - run: lint, test, format, type-check scripts - other workflow jobs will do that.

            For each issue found, provide a concise explanation of why it is a problem and a concrete recommendation or code snippet for how to fix it.
