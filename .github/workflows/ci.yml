name: PR CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Runs every gate on the chosen ref; on `main` it also deploys (see `publish`).
  workflow_dispatch:

# The event name keeps a deploy out of the push group: a push to `main` must not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run lint
        run: vp run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run format check
        run: vp run format:check

  specs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: false
          run-install: false

      - name: Validate OpenSpec specs
        run: vp dlx @fission-ai/openspec@1.16.1 validate --specs --strict

  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run type check
        run: vp run type-check

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false

      - name: Install package dependencies without Nuxt prepare
        run: vp install --filter "@osi/time-tracker-extension-protocol..." --ignore-scripts --frozen-lockfile

      - name: Run independent tracker and protocol package checks
        run: vp run package:check

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run unit tests
        run: vp run test:unit

  extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false

      - name: Install extension dependencies without Nuxt prepare
        run: vp install --filter "@osi/time-tracker-extension..." --ignore-scripts --frozen-lockfile

      - name: Run independent extension lint
        run: vp run --filter @osi/time-tracker-extension lint

      - name: Build extension workspace dependencies
        run: vp run build:packages

      - name: Run independent extension type check
        run: vp run --filter @osi/time-tracker-extension type-check

      - name: Install Playwright Chromium
        run: vp exec --filter @osi/time-tracker-extension playwright install --with-deps chromium

      - name: Run extension unit and browser tests
        run: vp run test:extension

  nuxt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run Nuxt integration tests
        run: vp run test:nuxt

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run build
        run: vp run build
        env:
          # This job is the e2e skip-build artifact, not a production deploy
          # image (that is the Dockerfile, which does not set IS_E2E). Baking
          # e2e knobs here does not weaken hosted production.
          #
          # nuxt-security routeRules (login limiter, global limiter) compile
          # at `vp run build`; runtime IS_E2E in the api/ui jobs is too late.
          NUXT_BUILD_SOURCEMAP: '1'
          IS_E2E: 'true'

      - name: Upload production output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuxt-output
          path: apps/web/.output
          retention-days: 1
          include-hidden-files: true

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run coverage
        run: vp run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: apps/web/coverage/lcov.info
          flags: unit-nuxt
          token: ${{ secrets.CODECOV_TOKEN }}

  db:
    runs-on: ubuntu-latest
    needs: [lint, format, type-check, package, unit, extension, nuxt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run database e2e tests with coverage
        run: vp run test:coverage:e2e-db

      - name: Upload e2e-db coverage to Codecov
        if: success()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: apps/web/coverage-e2e-db/lcov.info
          flags: e2e-db
          token: ${{ secrets.CODECOV_TOKEN }}

  api:
    runs-on: ubuntu-latest
    needs: [lint, format, type-check, package, unit, extension, nuxt, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Download production output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuxt-output
          path: apps/web/.output

      - name: Run API e2e tests
        run: vp run test:e2e:api
        env:
          NUXT_TEST_SKIP_BUILD: '1'
          IS_E2E: 'true'
          NODE_V8_COVERAGE: coverage-v8-e2e

      - name: Convert Nitro coverage
        run: vp exec --filter @osi/time-tracker-web tsx test/e2e/harness/report-e2e-coverage.ts
        env:
          NODE_V8_COVERAGE: coverage-v8-e2e

      - name: Upload e2e-api coverage to Codecov
        if: success()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: apps/web/coverage-e2e-api/lcov.info
          flags: e2e-api
          token: ${{ secrets.CODECOV_TOKEN }}

  ui:
    runs-on: ubuntu-latest
    needs: [lint, format, type-check, package, unit, extension, nuxt, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Download production output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuxt-output
          path: apps/web/.output

      - name: Install Playwright Chromium
        run: vp exec --filter @osi/time-tracker-web playwright install --with-deps chromium

      - name: Run UI e2e tests
        run: vp run test:e2e:ui
        env:
          NUXT_TEST_SKIP_BUILD: '1'
          IS_E2E: 'true'

  # Ships a verified `main` to production when started by hand: pushes both images to GHCR,
  # then commits the osieka.dev compose, pinned to their digests, to the `deploy` branch,
  # which the host polls. See deploy/osieka-dev/README.md.
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs:
      [
        lint,
        format,
        specs,
        type-check,
        package,
        unit,
        extension,
        nuxt,
        build,
        coverage,
        db,
        api,
        ui,
      ]
    permissions:
      contents: write
      packages: write
    env:
      MIGRATOR_REPOSITORY: ghcr.io/rafalosieka/osi-time-tracker-migrator
      APP_REPOSITORY: ghcr.io/rafalosieka/osi-time-tracker
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # A package this push creates would take the repository's visibility, public from its
      # first push, so both are created private by hand first.
      - name: Check the packages exist and are private
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for repository in "$MIGRATOR_REPOSITORY" "$APP_REPOSITORY"; do
            scope="repository:${repository#ghcr.io/}:pull"
            # GHCR hands an anonymous pull token out only for a public package.
            if curl -fsS "https://ghcr.io/token?scope=$scope" > /dev/null 2>&1; then
              echo "$repository is public"
              exit 1
            fi
            # As this run, the package must already exist and let this repository in.
            token=$(curl -fsS -u "$GITHUB_ACTOR:$GITHUB_TOKEN" "https://ghcr.io/token?scope=$scope" | jq -r .token)
            if ! curl -fsS -H "Authorization: Bearer $token" "https://ghcr.io/v2/${repository#ghcr.io/}/tags/list" > /dev/null; then
              echo "$repository is missing, or this repository has no Actions access to it"
              exit 1
            fi
          done

      - name: Build and push images
        run: |
          docker build --target migrator --tag "$MIGRATOR_REPOSITORY:$GITHUB_SHA" --push .
          docker build --target runtime --build-arg COMMIT_SHA="$GITHUB_SHA" \
            --tag "$APP_REPOSITORY:$GITHUB_SHA" --push .

      # Pinned to the digests GHCR holds, so the host runs exactly what was pushed.
      - name: Render the production compose
        run: |
          digest() { docker buildx imagetools inspect "$1:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -er .digest; }
          MIGRATOR_IMAGE="$MIGRATOR_REPOSITORY@$(digest "$MIGRATOR_REPOSITORY")"
          APP_IMAGE="$APP_REPOSITORY@$(digest "$APP_REPOSITORY")"
          export MIGRATOR_IMAGE APP_IMAGE
          # Only the two images: every other variable is a secret or setting the host supplies.
          # shellcheck disable=SC2016 # the list names the variables, unexpanded
          envsubst '${MIGRATOR_IMAGE} ${APP_IMAGE}' < deploy/osieka-dev/compose.yaml > "$RUNNER_TEMP/compose.yaml"
          # Putting the variables back must give the template again, secrets and all.
          sed -e "s|$MIGRATOR_IMAGE|\${MIGRATOR_IMAGE}|" -e "s|$APP_IMAGE|\${APP_IMAGE}|" "$RUNNER_TEMP/compose.yaml" |
            diff - deploy/osieka-dev/compose.yaml
          grep -qF "image: $MIGRATOR_IMAGE" "$RUNNER_TEMP/compose.yaml"
          grep -qF "image: $APP_IMAGE" "$RUNNER_TEMP/compose.yaml"

      # One commit per deploy, so the branch's history is the deploy log. Never forced: a push
      # that isn't a fast-forward fails rather than rewrite it.
      - name: Commit the production compose to deploy
        run: |
          message=$(git log -1 --format='Deploy %H to prod%n%n%s')
          if git ls-remote --exit-code origin refs/heads/deploy; then
            git fetch --depth=1 origin deploy
            git switch --create deploy FETCH_HEAD
          else
            git switch --orphan deploy
          fi
          mkdir -p prod
          cp "$RUNNER_TEMP/compose.yaml" prod/compose.yaml
          git add prod/compose.yaml
          if git diff --cached --quiet; then
            echo "prod/compose.yaml on deploy already pins these images"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --message "$message"
          git push origin deploy

  # CI can't see the host pull a deploy, so it waits for production's `/healthz` to report the
  # commit. The URL and the access token are secrets so GitHub masks them in the public logs.
  verify-deploy:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Wait for production to run this commit
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          PROD_ACCESS_CLIENT_ID: ${{ secrets.PROD_ACCESS_CLIENT_ID }}
          PROD_ACCESS_CLIENT_SECRET: ${{ secrets.PROD_ACCESS_CLIENT_SECRET }}
        run: |
          deadline=$((SECONDS + 15 * 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            # An answer that isn't JSON, such as Cloudflare's error page, fails `jq`: not yet.
            commit=$(curl -fsS --max-time 10 \
              -H "CF-Access-Client-Id: $PROD_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $PROD_ACCESS_CLIENT_SECRET" \
              "$PROD_URL/healthz" | jq -r .commit) || commit=
            if [ "$commit" = "$GITHUB_SHA" ]; then
              exit 0
            fi
            echo "production runs '${commit:-nothing}', waiting for $GITHUB_SHA"
            sleep 30
          done
          echo "production didn't report $GITHUB_SHA within 15 minutes"
          exit 1
