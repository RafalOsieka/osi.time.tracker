name: PR CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run lint
        run: vp run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run format check
        run: vp run format:check

  specs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: false
          run-install: false

      # Pinned: 1.14.0 reports over-long requirements only as INFO, so --strict passes there.
      - name: Validate OpenSpec specs
        run: vp dlx @fission-ai/openspec@1.14.1 validate --specs --strict

  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run type check
        run: vp run type-check

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: false

      - name: Install package dependencies without Nuxt prepare
        run: vp install --filter "@osi/extension-protocol..." --ignore-scripts --frozen-lockfile

      - name: Run independent tracker and protocol package checks
        run: vp run package:check

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run unit tests
        run: vp run test:unit

  extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: false

      - name: Install extension dependencies without Nuxt prepare
        run: vp install --filter "@osi/extension..." --ignore-scripts --frozen-lockfile

      - name: Run independent extension lint
        run: vp run --filter @osi/extension lint

      - name: Build extension workspace dependencies
        run: vp run build:packages

      - name: Run independent extension type check
        run: vp run --filter @osi/extension type-check

      - name: Install Playwright Chromium
        run: vp exec --filter @osi/extension playwright install --with-deps chromium

      - name: Run extension unit and browser tests
        run: vp run test:extension

  nuxt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run Nuxt integration tests
        run: vp run test:nuxt

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run build
        run: vp run build
        env:
          # This job is the e2e skip-build artifact, not a production deploy
          # image (that is the Dockerfile, which does not set IS_E2E). Baking
          # e2e knobs here does not weaken hosted production.
          #
          # nuxt-security routeRules (login limiter, global limiter) compile
          # at `vp run build`; runtime IS_E2E in the api/ui jobs is too late.
          NUXT_BUILD_SOURCEMAP: '1'
          IS_E2E: 'true'

      - name: Upload production output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuxt-output
          path: apps/web/.output
          retention-days: 1
          include-hidden-files: true

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run coverage
        run: vp run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: apps/web/coverage/lcov.info
          flags: unit-nuxt
          token: ${{ secrets.CODECOV_TOKEN }}

  db:
    runs-on: ubuntu-latest
    needs: [lint, format, type-check, package, unit, extension, nuxt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run database e2e tests with coverage
        run: vp run test:coverage:e2e-db
        env:
          NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}

      - name: Upload e2e-db coverage to Codecov
        if: success()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: apps/web/coverage-e2e-db/lcov.info
          flags: e2e-db
          token: ${{ secrets.CODECOV_TOKEN }}

  api:
    runs-on: ubuntu-latest
    needs: [lint, format, type-check, package, unit, extension, nuxt, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Download production output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuxt-output
          path: apps/web/.output

      - name: Run API e2e tests
        run: vp run test:e2e:api
        env:
          NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
          NUXT_TEST_SKIP_BUILD: '1'
          IS_E2E: 'true'
          NODE_V8_COVERAGE: coverage-v8-e2e

      - name: Convert Nitro coverage
        run: vp exec --filter @osi/time-tracker tsx test/e2e/harness/report-e2e-coverage.ts
        env:
          NODE_V8_COVERAGE: coverage-v8-e2e

      - name: Upload e2e-api coverage to Codecov
        if: success()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: apps/web/coverage-e2e-api/lcov.info
          flags: e2e-api
          token: ${{ secrets.CODECOV_TOKEN }}

  ui:
    runs-on: ubuntu-latest
    needs: [lint, format, type-check, package, unit, extension, nuxt, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Download production output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuxt-output
          path: apps/web/.output

      - name: Install Playwright Chromium
        run: vp exec --filter @osi/time-tracker playwright install --with-deps chromium

      - name: Run UI e2e tests
        run: vp run test:e2e:ui
        env:
          NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
          NUXT_TEST_SKIP_BUILD: '1'
          IS_E2E: 'true'
