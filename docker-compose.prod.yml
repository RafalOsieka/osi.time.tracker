# Self-contained production stack: PostgreSQL, one-shot migrator, the app, and pgadmin.
# Remote trackers (OpenProject / Redmine) are real instances configured in-app.
#
# Setup:  cp .env.example .env   # then set the "Production compose" section
# Start:  docker compose -f docker-compose.prod.yml up -d --build
# Stop:   docker compose -f docker-compose.prod.yml down     # keeps volumes
# Wipe:   docker compose -f docker-compose.prod.yml down -v  # deletes prod volumes
#
# NUXT_SESSION_PASSWORD, POSTGRES_PASSWORD and PGADMIN_DEFAULT_PASSWORD are required;
# the stack refuses to start without them. The database port is not published.

# Explicit project name so this stack never shares containers/volumes with the
# dev docker-compose.yml in the same directory.
name: osi-time-tracker-prod

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-osi_time_tracker}
    volumes:
      - pg-osi-time-tracker-standalone:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-osi_time_tracker}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - osi-time-tracker-standalone

  migrate:
    build:
      context: .
      target: build
    command: pnpm db:migrate
    restart: 'no'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-osi_time_tracker}
      BOOTSTRAP_USER_EMAIL: ${BOOTSTRAP_USER_EMAIL:-}
      BOOTSTRAP_USER_PASSWORD: ${BOOTSTRAP_USER_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - osi-time-tracker-standalone

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-osi_time_tracker}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?NUXT_SESSION_PASSWORD is required}
      # Optional; raises server log verbosity for troubleshooting (server-logging REQ-357).
      # 0 fatal, 1 error, 2 warn, 3 info (default), 4 debug, 5 trace.
      CONSOLA_LEVEL: ${CONSOLA_LEVEL:-3}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - osi-time-tracker-standalone

  pgadmin:
    image: dpage/pgadmin4:9.16
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
    ports:
      - '${PGADMIN_PORT:-8080}:80'
    volumes:
      - pgadmin-osi-time-tracker-standalone:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - osi-time-tracker-standalone

# Volume and network names keep the former "standalone" suffix so existing
# deployments keep their data across the file rename.
volumes:
  pg-osi-time-tracker-standalone:
  pgadmin-osi-time-tracker-standalone:

networks:
  osi-time-tracker-standalone:
