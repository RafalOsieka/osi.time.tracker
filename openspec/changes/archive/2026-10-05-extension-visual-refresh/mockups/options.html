<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extension setup</title>
<!-- Static mockup of the extension options page (tab, content max 672 px), light and dark theme
     side by side, with a missing-access row and the HTTP warning visible. Reference only; the real
     page is built from Nuxt UI components (UCard, UFormField, UInput, USelect, UButton, UBadge,
     UAlert, UAvatar, UTooltip). -->
<style>
html{background:#e2e8f0}
body{margin:0;padding:32px 16px;display:flex;flex-wrap:wrap;gap:40px;justify-content:center;font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.45}
figure{margin:0;display:flex;flex-direction:column;gap:8px}
figcaption{font-size:12px;font-weight:600;color:#475569}
.light{--bg:#fff;--border:#e2e8f0;--ring:#cbd5e1;--elevated:#f1f5f9;--text:#334155;--high:#0f172a;--dim:#64748b;--primary:#06b6d4;--on-primary:#fff;--warn:#ca8a04;--warn-soft:rgba(234,179,8,.10);--warn-ring:rgba(234,179,8,.25);--ok:#16a34a;--error:#ef4444}
.dark{--bg:#0f172a;--border:#1e293b;--ring:#334155;--elevated:#1e293b;--text:#e2e8f0;--high:#fff;--dim:#94a3b8;--primary:#22d3ee;--on-primary:#0f172a;--warn:#facc15;--warn-soft:rgba(250,204,21,.10);--warn-ring:rgba(250,204,21,.25);--ok:#4ade80;--error:#f87171}
.page{width:760px;box-sizing:border-box;padding:40px 44px 56px;background:var(--bg);color:var(--text);box-shadow:0 2px 16px rgba(15,23,42,.18)}
main{max-width:672px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;color:var(--primary);flex-shrink:0}
h1{margin:0;font-size:20px;font-weight:600;color:var(--high)}
.muted{font-size:13px;color:var(--dim)}
.prefs{display:flex;gap:8px}
.field{display:flex;flex-direction:column;gap:4px}
.label{font-size:14px;font-weight:500;color:var(--text)}
.prefs .label{font-size:12px}
.select,.input{display:flex;align-items:center;gap:6px;box-sizing:border-box;padding:6px 10px;border:0;border-radius:6px;font:inherit;background:var(--bg);color:var(--high);box-shadow:inset 0 0 0 1px var(--ring);text-align:left}
.prefs .select{width:140px;padding:5px 8px;font-size:13px}
.select span{flex-grow:1}
.input{width:100%}
.input.focus{box-shadow:inset 0 0 0 2px var(--primary)}
.icon{width:16px;height:16px;flex-shrink:0;color:var(--dim)}
.status{margin:0;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ok)}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:8px;background:var(--warn-soft);box-shadow:inset 0 0 0 1px var(--warn-ring);color:var(--warn)}
.alert strong{display:block;font-weight:500}
.alert span{font-size:13px;opacity:.9}
.alert.sm{padding:10px 12px;font-size:13px;gap:8px}
.card{border-radius:8px;box-shadow:inset 0 0 0 1px var(--border)}
.card-h{padding:16px 20px;border-bottom:1px solid var(--border)}
.card-h h2{margin:0;font-size:16px;font-weight:600;color:var(--high)}
.card-h p{margin:4px 0 0}
.card-b{padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.card-f{padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
.row{display:flex;align-items:flex-end;gap:8px}
.row .field{flex-grow:1}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
form{display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:0;border-radius:6px;font:inherit;font-weight:500;background:var(--primary);color:var(--on-primary);white-space:nowrap;align-self:flex-start}
.row .btn{align-self:auto}
.btn-soft{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border:0;border-radius:6px;font:inherit;font-size:12px;font-weight:500;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.btn-icon{display:inline-flex;padding:6px;border:0;border-radius:6px;background:transparent;color:var(--error)}
ul{margin:0;padding:0;list-style:none;border-radius:8px;box-shadow:inset 0 0 0 1px var(--border)}
li{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px}
li+li{border-top:1px solid var(--border)}
.origin{flex-grow:1;min-width:0;overflow-wrap:anywhere;color:var(--high)}
.sub{display:block;font-size:12px;color:var(--dim)}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:6px;flex-shrink:0;background:var(--elevated);color:var(--text);font-size:12px;font-weight:600}
.badge{padding:2px 6px;border-radius:6px;font-size:12px;font-weight:500;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15.6 21.5H12A9.5 9.5 0 1 1 21.5 12" stroke-width="2"/><path d="M8.5 9.3H15.5" stroke-width="2.6"/></g><path d="M10.7 9.3H13.3L12.4 16.9H11.6Z" fill="currentColor" stroke="currentColor" stroke-width="0.4" stroke-linejoin="round"/></symbol>
  <symbol id="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></symbol>
  <symbol id="alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="languages" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></symbol>
  <symbol id="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
  <symbol id="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  <symbol id="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
  <symbol id="trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></symbol>
  <symbol id="shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></symbol>
</svg>

<template id="content">
<main>
  <header class="head">
    <div class="brand">
      <svg class="mark" role="img" aria-label="OSI Time Tracker"><use href="#mark"/></svg>
      <div><h1>Konfiguracja wtyczki</h1><div class="muted">OSI Time Tracker · v0.1.0</div></div>
    </div>
    <div class="prefs">
      <div class="field"><span class="label">Język</span><button class="select" type="button" aria-haspopup="listbox"><svg class="icon" aria-hidden="true"><use href="#languages"/></svg><span>polski</span><svg class="icon" aria-hidden="true"><use href="#chevron"/></svg></button></div>
      <div class="field"><span class="label">Motyw</span><button class="select" type="button" aria-haspopup="listbox"><svg class="icon" aria-hidden="true"><use href="#THEME_ICON"/></svg><span>THEME_LABEL</span><svg class="icon" aria-hidden="true"><use href="#chevron"/></svg></button></div>
    </div>
  </header>

  <p class="status" role="status"><svg class="icon" style="color:inherit" aria-hidden="true"><use href="#check"/></svg>Zatwierdzenie zapisane.</p>

  <div class="alert" role="alert">
    <svg width="20" height="20" aria-hidden="true" style="flex-shrink:0"><use href="#alert"/></svg>
    <div><strong>Brak dostępu w przeglądarce</strong><span>Niektórym zapisanym zatwierdzeniom brakuje dostępu do witryny w przeglądarce. Przywróć dostęp w odpowiednim wierszu konfiguracji; samo zatwierdzenie nie zapewnia dostępu.</span></div>
  </div>

  <section class="card">
    <div class="card-h"><h2>Zatwierdzone witryny</h2><p class="muted">Podaj wyłącznie origin witryny, np. https://time.example.com lub http://localhost:3000. HTTPS jest wymagany poza adresami pętli zwrotnej.</p></div>
    <div class="card-b">
      <div class="row">
        <div class="field"><span class="label">Origin witryny</span><span class="input" style="color:var(--dim)">https://time.example.com</span></div>
        <button class="btn" type="button"><svg width="18" height="18" aria-hidden="true"><use href="#plus"/></svg>Zatwierdź witrynę</button>
      </div>
      <ul>
        <li><svg class="icon" aria-hidden="true"><use href="#globe"/></svg><span class="origin">https://osi.example.com</span><button class="btn-icon" type="button" aria-label="Cofnij witrynę https://osi.example.com"><svg width="18" height="18" aria-hidden="true"><use href="#trash"/></svg></button></li>
        <li><svg class="icon" aria-hidden="true"><use href="#globe"/></svg><span class="origin">http://localhost:3000</span><span class="badge">Brak dostępu</span><button class="btn-soft" type="button"><svg width="16" height="16" aria-hidden="true"><use href="#shield"/></svg>Przywróć dostęp</button><button class="btn-icon" type="button" aria-label="Cofnij witrynę http://localhost:3000"><svg width="18" height="18" aria-hidden="true"><use href="#trash"/></svg></button></li>
      </ul>
    </div>
    <div class="card-f muted"><svg class="icon" aria-hidden="true"><use href="#info"/></svg>Odśwież otwarte karty OSI po zmianie zatwierdzeń witryn.</div>
  </section>

  <section class="card">
    <div class="card-h"><h2>Zatwierdzone trackery</h2><p class="muted">Podaj pełny bazowy adres trackera, z https:// (lub http://) i ścieżką instalacji, np. https://tracker.example.com/redmine.</p></div>
    <div class="card-b">
      <form>
        <div class="grid">
          <div class="field"><span class="label">Witryna</span><button class="select" type="button" aria-haspopup="listbox"><span>https://osi.example.com</span><svg class="icon" aria-hidden="true"><use href="#chevron"/></svg></button></div>
          <div class="field"><span class="label">Dostawca</span><button class="select" type="button" aria-haspopup="listbox"><span>Redmine</span><svg class="icon" aria-hidden="true"><use href="#chevron"/></svg></button></div>
        </div>
        <div class="field"><span class="label">Adres trackera</span><span class="input focus">http://redmine.local</span></div>
        <div class="alert sm" role="status"><svg width="18" height="18" aria-hidden="true" style="flex-shrink:0"><use href="#alert"/></svg>Adresy HTTP wysyłają dane uwierzytelniające trackera bez szyfrowania. Preferuj HTTPS, chyba że to środowisko lokalne.</div>
        <button class="btn" type="button"><svg width="18" height="18" aria-hidden="true"><use href="#plus"/></svg>Zatwierdź tracker</button>
      </form>
      <ul>
        <li><span class="avatar" aria-hidden="true">OP</span><span class="origin">https://op.firma.pl<span class="sub">OpenProject · Witryna: https://osi.example.com</span></span><button class="btn-icon" type="button" aria-label="Cofnij tracker https://op.firma.pl"><svg width="18" height="18" aria-hidden="true"><use href="#trash"/></svg></button></li>
        <li><span class="avatar" aria-hidden="true">RM</span><span class="origin">https://tracker.example.com/redmine<span class="sub">Redmine · Witryna: http://localhost:3000</span></span><span class="badge">Brak dostępu</span><button class="btn-soft" type="button"><svg width="16" height="16" aria-hidden="true"><use href="#shield"/></svg>Przywróć dostęp</button><button class="btn-icon" type="button" aria-label="Cofnij tracker https://tracker.example.com/redmine"><svg width="18" height="18" aria-hidden="true"><use href="#trash"/></svg></button></li>
      </ul>
    </div>
  </section>
</main>
</template>

<figure class="light"><figcaption>Jasny (domyślny)</figcaption><div class="page" data-theme-icon="sun" data-theme-label="Jasny"></div></figure>
<figure class="dark"><figcaption>Ciemny</figcaption><div class="page" data-theme-icon="moon" data-theme-label="Ciemny"></div></figure>

<script>
// Fills both theme frames from one template so the two variants cannot drift.
const source = document.getElementById('content').innerHTML;
for (const page of document.querySelectorAll('.page')) {
  page.innerHTML = source
    .replace('THEME_ICON', page.dataset.themeIcon)
    .replace('THEME_LABEL', page.dataset.themeLabel);
}
</script>
</body>
</html>
