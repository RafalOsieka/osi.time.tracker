<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extension popup</title>
<!-- Static mockup of the extension popup (360 px wide), light and dark theme side by side, in the
     "needs attention" state. Reference only; the real popup is built from Nuxt UI components. -->
<style>
html{background:#e2e8f0}
body{margin:0;padding:32px 16px;display:flex;flex-wrap:wrap;gap:40px;justify-content:center;font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.45}
figure{margin:0;display:flex;flex-direction:column;gap:8px}
figcaption{font-size:12px;font-weight:600;color:#475569}
.light{--bg:#fff;--border:#e2e8f0;--ring:#cbd5e1;--elevated:#f1f5f9;--text:#334155;--high:#0f172a;--dim:#64748b;--primary:#06b6d4;--warn:#ca8a04;--warn-soft:rgba(234,179,8,.10);--warn-ring:rgba(234,179,8,.25);--ok:#16a34a;--ok-soft:rgba(34,197,94,.10)}
.dark{--bg:#0f172a;--border:#1e293b;--ring:#334155;--elevated:#1e293b;--text:#e2e8f0;--high:#fff;--dim:#94a3b8;--primary:#22d3ee;--warn:#facc15;--warn-soft:rgba(250,204,21,.10);--warn-ring:rgba(250,204,21,.25);--ok:#4ade80;--ok-soft:rgba(74,222,128,.10)}
.popup{width:360px;display:flex;flex-direction:column;background:var(--bg);color:var(--text);box-shadow:0 2px 16px rgba(15,23,42,.18);border-radius:8px;overflow:hidden}
.head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.mark{width:28px;height:28px;color:var(--primary);flex-shrink:0}
.title{display:flex;flex-direction:column;flex-grow:1;min-width:0}
.title h1{margin:0;font-size:14px;font-weight:600;color:var(--high)}
.title span{font-size:12px;color:var(--dim)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:500;background:var(--warn-soft);color:var(--warn);flex-shrink:0}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge .dot{width:6px;height:6px;border-radius:999px;background:currentColor}
.badge.sm{padding:2px 6px;font-size:11px}
.body{display:flex;flex-direction:column;gap:16px;padding:16px}
.alert{display:flex;gap:10px;padding:12px;border-radius:8px;background:var(--warn-soft);box-shadow:inset 0 0 0 1px var(--warn-ring);color:var(--warn)}
.alert strong{display:block;font-size:13px;font-weight:500}
.alert span{font-size:12px;opacity:.9}
h2{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--dim)}
ul{margin:0;padding:0;list-style:none;border-radius:8px;box-shadow:inset 0 0 0 1px var(--border)}
li{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:13px}
li+li{border-top:1px solid var(--border)}
.origin{flex-grow:1;min-width:0;overflow-wrap:anywhere;color:var(--high)}
.sub{display:block;font-size:12px;color:var(--dim)}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;flex-shrink:0;background:var(--elevated);color:var(--text);font-size:11px;font-weight:600}
.icon{width:16px;height:16px;flex-shrink:0;color:var(--dim)}
.foot{padding:12px 16px;border-top:1px solid var(--border)}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 10px;border:0;border-radius:6px;font:inherit;font-weight:500;background:var(--bg);color:var(--text);box-shadow:inset 0 0 0 1px var(--ring)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15.6 21.5H12A9.5 9.5 0 1 1 21.5 12" stroke-width="2"/><path d="M8.5 9.3H15.5" stroke-width="2.6"/></g><path d="M10.7 9.3H13.3L12.4 16.9H11.6Z" fill="currentColor" stroke="currentColor" stroke-width="0.4" stroke-linejoin="round"/></symbol>
  <symbol id="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></symbol>
  <symbol id="alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></symbol>
</svg>

<figure class="light">
<figcaption>Jasny (domyślny)</figcaption>
<main class="popup">
  <header class="head">
    <svg class="mark" role="img" aria-label="OSI Time Tracker"><use href="#mark"/></svg>
    <div class="title"><h1>OSI Time Tracker</h1><span>Status wtyczki</span></div>
    <span class="badge" role="status"><span class="dot"></span>Wymaga uwagi</span>
  </header>
  <div class="body">
    <div class="alert" role="alert">
      <svg width="20" height="20" aria-hidden="true"><use href="#alert"/></svg>
      <div><strong>Brak dostępu do witryny w przeglądarce</strong><span>Przywróć dostęp w konfiguracji; samo zatwierdzenie nie zapewnia dostępu.</span></div>
    </div>
    <section>
      <h2>Zapisane witryny</h2>
      <ul>
        <li><svg class="icon" aria-hidden="true"><use href="#globe"/></svg><span class="origin">https://osi.example.com</span></li>
        <li><svg class="icon" aria-hidden="true"><use href="#globe"/></svg><span class="origin">http://localhost:3000</span></li>
      </ul>
    </section>
    <section>
      <h2>Zapisane trackery</h2>
      <ul>
        <li><span class="avatar" aria-hidden="true">OP</span><span class="origin">https://op.firma.pl<span class="sub">OpenProject · osi.example.com</span></span></li>
        <li><span class="avatar" aria-hidden="true">RM</span><span class="origin">https://tracker.example.com/redmine<span class="sub">Redmine · localhost:3000</span></span><span class="badge sm">Brak dostępu</span></li>
      </ul>
    </section>
  </div>
  <footer class="foot"><button class="btn" type="button"><svg width="18" height="18" aria-hidden="true"><use href="#settings"/></svg>Otwórz konfigurację</button></footer>
</main>
</figure>
