<!--
  Canonical chrome glyph. Geometry source: openspec/changes/open-dial-brand-mark/design.md (D1).
  Single colour via currentColor; derived tiles substitute it for #fff.

  Derived assets (regenerate all of them when this file changes):
    public/icon.svg            maskable source, glyph at 75% of the 32x32 tile
    public/favicon.svg         tab icon, glyph at 88%
    public/favicon-running.svg tab icon, glyph at 88%, green tile fill
  The raster public/favicon.ico is cut from public/favicon.svg.

  Browser extension copies (separate build, so copied rather than imported):
    apps/extension/src/ui/BrandMark.vue        inline copy of this glyph in currentColor
    apps/extension/public/icons/icon-*.png     16/32/48/128 rasters of public/favicon.svg, cut with
      a one-off pnpx sharp-cli@5 run per size (density 1200, resize to n x n). XML comments cannot
      hold a double hyphen, so the exact command is in the comment of apps/extension/src/manifest.ts.

  Grid: centre (12,12). Open dial: one stroke (width 2) from a bar at 6 o'clock, clockwise along
  r=9.5 through 9 and 12 to 3; the 3-6 quadrant stays open. Monogram: T with a 2.6 crossbar and a
  stem tapering from 2.6 to 0.8 like a clock hand pointing at 6.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15.6 21.5H12A9.5 9.5 0 1 1 21.5 12" stroke-width="2" />
    <path d="M8.5 9.3H15.5" stroke-width="2.6" />
  </g>
  <path d="M10.7 9.3H13.3L12.4 16.9H11.6Z" stroke="currentColor" stroke-width="0.4" stroke-linejoin="round" />
</svg>
