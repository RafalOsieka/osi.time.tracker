# Local development infrastructure. The app itself runs on the host (`pnpm dev`),
# and migrations are applied from the host (`pnpm db:migrate`).
#
# Default:   docker compose up -d                       # db + pgadmin
# Trackers:  docker compose --profile trackers up -d    # + OpenProject + Redmine
# Stop:      docker compose --profile trackers down     # keeps volumes
# Wipe:      docker compose --profile trackers down -v  # deletes ALL dev volumes
#
# OpenProject: http://localhost:8090 (admin / admin)   — override with OPENPROJECT_PORT
# Redmine:     http://localhost:8091 (admin / admin)   — override with REDMINE_PORT
# The tracker services are for local development only — never use them in production.

# Explicit project name so this stack never shares containers/volumes with
# docker-compose.prod.yml, which lives in the same directory.
name: osi-time-tracker

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-osi_time_tracker}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pg-osi-time-tracker:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-osi_time_tracker}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.16
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - '${PGADMIN_PORT:-8080}:80'
    volumes:
      - pgadmin-osi-time-tracker:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  # ── trackers profile ────────────────────────────────────────────────────────

  openproject:
    profiles: [trackers]
    image: openproject/openproject:17.5.1
    restart: unless-stopped
    environment:
      OPENPROJECT_HTTPS: 'false'
      OPENPROJECT_HOST__NAME: localhost:${OPENPROJECT_PORT:-8090}
      OPENPROJECT_DEFAULT__LANGUAGE: en
      OPENPROJECT_DEMO__DATA: 'true'
      OPENPROJECT_SEED_ADMIN_USER_PASSWORD: ${OPENPROJECT_ADMIN_PASSWORD:-admin}
      SECRET_KEY_BASE: ${OPENPROJECT_SECRET_KEY_BASE:-change-me-to-a-random-64-character-development-secret-key-base}
    ports:
      - '${OPENPROJECT_PORT:-8090}:80'
    volumes:
      - pg-openproject-dev:/var/openproject/pgdata
      - openproject-assets-dev:/var/openproject/assets
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail http://localhost/health_checks/default || exit 1']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 2m

  redmine-db:
    profiles: [trackers]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${REDMINE_DB_USERNAME:-redmine}
      POSTGRES_PASSWORD: ${REDMINE_DB_PASSWORD:-redmine}
      POSTGRES_DB: ${REDMINE_DB_DATABASE:-redmine}
    volumes:
      - pg-redmine-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-redmine} -d $${POSTGRES_DB:-redmine}']
      interval: 10s
      timeout: 5s
      retries: 5

  redmine:
    profiles: [trackers]
    image: redmine:6
    restart: unless-stopped
    depends_on:
      redmine-db:
        condition: service_healthy
    environment:
      REDMINE_DB_POSTGRES: redmine-db
      REDMINE_DB_DATABASE: ${REDMINE_DB_DATABASE:-redmine}
      REDMINE_DB_USERNAME: ${REDMINE_DB_USERNAME:-redmine}
      REDMINE_DB_PASSWORD: ${REDMINE_DB_PASSWORD:-redmine}
      REDMINE_SECRET_KEY_BASE: ${REDMINE_SECRET_KEY_BASE:-change-me-to-a-random-64-character-development-secret-key-base}
      # Official image has no built-in default-data flag; our entrypoint wrapper
      # reads this and runs `rake redmine:load_default_data` on boot.
      REDMINE_LOAD_DEFAULT_DATA: ${REDMINE_LOAD_DEFAULT_DATA:-true}
      REDMINE_LANG: ${REDMINE_LANG:-en}
    ports:
      - '${REDMINE_PORT:-8091}:3000'
    volumes:
      - redmine-files-dev:/usr/src/redmine/files
    # Wrap the stock entrypoint so first boot seeds roles, statuses, workflows,
    # and time-entry activities (Design/Development) via load_default_data.
    entrypoint: ['/bin/bash', '-ec']
    command:
      - |
        if [ "$${REDMINE_LOAD_DEFAULT_DATA:-true}" = "true" ]; then
          /docker-entrypoint.sh rake db:migrate
          if ! REDMINE_LANG="$${REDMINE_LANG:-en}" /docker-entrypoint.sh rake redmine:load_default_data; then
            echo "redmine: default data already present or load skipped; continuing."
          fi
        fi
        exec /docker-entrypoint.sh rails server -b 0.0.0.0
    healthcheck:
      test: ['CMD-SHELL', "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3000'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 2m

volumes:
  pg-osi-time-tracker:
  pgadmin-osi-time-tracker:
  pg-openproject-dev:
  openproject-assets-dev:
  pg-redmine-dev:
  redmine-files-dev:
