# The osieka.dev instance: PostgreSQL, the one-shot migrator, the app, a daily database backup
# and the Cloudflare Tunnel that is its only way in. The app publishes no port.
#
# A template: CI fills in MIGRATOR_IMAGE and APP_IMAGE, pinned by digest, and commits the
# result to the `deploy` branch. Every other variable stays as written and is a secret or
# setting the host supplies; the README next to this file lists them. POSTGRES_PASSWORD,
# NUXT_APP_SECRET and TUNNEL_TOKEN are required: the stack refuses to start without them.

# Every container's logs stay on the host, rotated at 10 MB x 3.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  # A new Postgres major can't open the old one's volume: it needs a dump and restore.
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: osi_time_tracker
    volumes:
      - pg-osi-time-tracker:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d osi_time_tracker']
      interval: 10s
      timeout: 5s
      retries: 5

  # Runs to completion before `app` starts; a failed migration keeps the app down.
  migrate:
    image: ${MIGRATOR_IMAGE}
    restart: 'no'
    logging: *logging
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/osi_time_tracker
      # Optional: seeds this user if it does not exist yet. Leave unset on a restored database.
      BOOTSTRAP_USER_EMAIL: ${BOOTSTRAP_USER_EMAIL:-}
      BOOTSTRAP_USER_PASSWORD: ${BOOTSTRAP_USER_PASSWORD:-}
      BOOTSTRAP_USER_DISPLAY_NAME: ${BOOTSTRAP_USER_DISPLAY_NAME:-}
      BOOTSTRAP_USER_TIMEZONE: ${BOOTSTRAP_USER_TIMEZONE:-}
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/osi_time_tracker
      NUXT_APP_SECRET: ${NUXT_APP_SECRET:?NUXT_APP_SECRET is required}
      # Optional: 0 fatal, 1 error, 2 warn, 3 info (default), 4 debug (every SQL statement), 5 trace.
      CONSOLA_LEVEL: ${CONSOLA_LEVEL:-3}
    # Healthy once `/healthz` answers, which takes the database answering too. The image
    # holds only Node, so Node's own fetch asks.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Writes a dump to its own volume on start and every 24 hours after, under a dated name,
  # and keeps 14 days of them. It only reads the database; restoring is a manual step.
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: osi_time_tracker
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          name="osi-time-tracker-$$(date +%F).dump"
          if pg_dump --format=custom --file="/backups/$$name.tmp"; then
            mv "/backups/$$name.tmp" "/backups/$$name"
            find /backups -name '*.dump' -mtime +13 -delete
            echo "backup: wrote $$name"
          else
            rm -f "/backups/$$name.tmp"
            echo "backup: pg_dump failed" >&2
          fi
          sleep 86400
        done
    volumes:
      - backups-osi-time-tracker:/backups
    depends_on:
      db:
        condition: service_healthy

  # Connects out to Cloudflare and forwards the tunnel's public hostname to `http://app:3000`
  # over the compose network. The tunnel is remotely managed: its routes live in Cloudflare.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    logging: *logging
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      # Read from the environment, so the token never shows in the process list.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
      # The metrics server, local to the container, answers the healthcheck's `/ready`.
      TUNNEL_METRICS: 127.0.0.1:2000
    # Healthy while the tunnel holds at least one connection to Cloudflare.
    healthcheck:
      test: ['CMD', 'cloudflared', 'tunnel', 'ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pg-osi-time-tracker:
  backups-osi-time-tracker:
